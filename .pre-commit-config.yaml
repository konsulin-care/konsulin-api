# Git Hooks Philosophy
# ====================
# pre-commit  → fast quality feedback (~10s target). No tests, no API calls.
# pre-push    → comprehensive local verification. Tests, Bruno API, vuln scan.
# CI          → authoritative enforcement. Cannot be bypassed with --no-verify.
#
# Hook name prefixes:
#   [quality]    — linting, formatting, file validation
#   [functional] — tests, build verification
#   [security]   — vulnerability scanning, RBAC/authorization checks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
        # --unsafe tolerates custom tags (e.g. Ansible vault's !vault) used in
        # deployments/playbook-*.yml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
        args: [--failure-threshold, error]
        types: [dockerfile]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Lints all GitHub Actions workflow files (.github/workflows/*).
      # Catches invalid on: triggers, job/step key typos, and malformed uses:
      # refs before the push reaches GitHub.
      - id: actionlint
        name: "[quality] actionlint (workflow lint)"

  - repo: local
    hooks:
      # golangci-lint on the current change only. Uses the same --new-from-patch
      # semantics as CI's only-new-issues gate, so the commit gate and the CI
      # gate can never disagree. No --fix: formatting problems are reported, not
      # silently rewritten and left unstaged.
      - id: golangci-lint
        name: "[quality] golangci-lint (new vs HEAD)"
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; p=$(mktemp); git diff HEAD -- . ":(exclude).pi/sandbox.json" > "$p"; CGO_ENABLED=0 mise exec golangci-lint -- golangci-lint run --new-from-patch="$p" --timeout=5m'
        language: system
        types: [go]
        pass_filenames: false

      # Ensure go.mod/go.sum are tidy
      - id: go-mod-tidy
        name: "[quality] go mod tidy"
        entry: bash -c 'go mod tidy && git diff --exit-code go.mod go.sum'
        language: system
        pass_filenames: false
        types: [go]

      # gofumpt on staged .go files, whole-file — same semantics as CI's
      # gofumpt -l step. Prevents pre-commit/CI disagreement on files that
      # carry pre-existing formatting debt (import grouping, etc.).
      - id: gofumpt
        name: "[quality] gofumpt (whole-file, staged .go)"
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; files=$(git diff --cached --name-only --diff-filter=ACM -- "*.go"); if [ -n "$files" ]; then v=$(mise exec gofumpt -- gofumpt -l $files); test -z "$v" || { echo "gofumpt violations:"; echo "$v"; exit 1; }; fi'
        language: system
        pass_filenames: false
        types: [go]

      # Pre-push: full test suite with race detection
      - id: go-test-all
        name: "[functional] go test -race (all packages)"
        entry: go test -race -v ./...
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Pre-push: Bruno API collection tests REQUIRED — fail if the API server
      # is down or any journey assertion fails. Includes ownership-violation/
      # RBAC tests. Runs the full journey without the chained teardown
      # (--skip-cleanup); scripts/bru-cleanup.sh sweeps the seeds afterwards,
      # invoked by bru-run.sh after the suite.
      - id: bru-run-required
        name: "[functional] bru run — required (ownership tests)"
        entry: bash scripts/bru-run.sh --required --skip-cleanup
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Pre-push: golangci-lint over the whole branch diff vs the base.
      # Replicates CI's only-new-issues gate and catches whole-branch debt:
      # files committed before config tightening, bot-pushed commits, and
      # anything the per-commit hook missed.
      - id: golangci-lint-branch
        name: "[quality] golangci-lint (new vs develop)"
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; base=$(git merge-base HEAD origin/develop 2>/dev/null || echo HEAD); p=$(mktemp); git diff "$base" -- . ":(exclude).pi/sandbox.json" > "$p"; CGO_ENABLED=0 mise exec golangci-lint -- golangci-lint run --new-from-patch="$p" --timeout=5m'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Pre-push: whole-file gofumpt on every .go file changed vs develop —
      # exact replica of CI's gofumpt step so the push gate and the CI gate
      # check identical files with identical semantics.
      - id: gofumpt-branch
        name: "[quality] gofumpt (whole-file, changed vs develop)"
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; base=$(git merge-base HEAD origin/develop 2>/dev/null || echo HEAD); files=$(git diff --name-only "$base" HEAD -- "*.go"); if [ -n "$files" ]; then v=$(mise exec gofumpt -- gofumpt -l $files); test -z "$v" || { echo "gofumpt violations:"; echo "$v"; exit 1; }; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Pre-push: vulnerability scanning — fail if govulncheck is not installed
      # or if any known vulnerability is found in the module dependency graph.
      - id: govulncheck
        name: "[security] govulncheck"
        entry: bash -c 'command -v govulncheck >/dev/null 2>&1 || { echo "govulncheck not found. Install via go install golang.org/x/vuln/cmd/govulncheck@latest" >&2; exit 1; }; govulncheck ./...'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Lint-config hygiene: validate .golangci.yml and re-scan the whole module
      # when it changes so tightened rules immediately resurface existing debt
      # instead of leaking to CI.
      - id: golangci-lint-config-verify
        name: "[quality] golangci-lint config verify"
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; mise exec golangci-lint -- golangci-lint config verify'
        language: system
        files: '\.golangci\.(yml|yaml)$'
        pass_filenames: false

      - id: golangci-lint-on-config-change
        name: "[quality] golangci-lint (full, config changed)"
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; CGO_ENABLED=0 mise exec golangci-lint -- golangci-lint run --timeout=5m'
        language: system
        files: '\.golangci\.(yml|yaml)$'
        pass_filenames: false
