# Disposable CI integration environment for API security testing.
#
# Ephemeral, isolated, synthetic-only: no production credentials, no real
# patient data. Started/stopped exclusively by GitHub Actions workflows
# (.github/workflows/pr.yml, .github/workflows/security-weekly.yml) via the
# composite action .github/actions/ci-env/action.yml — NOT for local
# development (see docker-compose.yml for that).
#
# Layout:
#   postgres      — SuperTokens core database
#   redis         — gateway session/cache store
#   blaze         — FHIR R4 server (seeded with synthetic resources)
#   supertokens   — passwordless auth core (magic links)
#   ci-stub       — unified Go stub server replacing both the external
#                    magic-link delivery webhook AND the Xendit payment API
#                    (scripts/ci/stub/)
#   gateway       — dev-mode federation gateway (external image), bootstrapped
#                    by scripts/ci/gateway-bootstrap.sh from pr.yml BEFORE the
#                    app starts (parties, enrollment, stub listings)
#   app           — the Konsulin API gateway image, pre-built by the workflow
#
# The app is started AFTER the infrastructure group, because the gateway
# performs boot-time FHIR and SuperTokens initialization and fatals otherwise.
# The workflow probes Blaze, SuperTokens and Redis from the runner
# before `docker compose up -d app`.
#
# The federation `gateway` service is started by pr.yml ahead of this file's
# `.env.ci` being written (the ci-env action writes it later), so every
# variable it interpolates uses `:-` defaults: absent values keep the
# app standalone (security-weekly.yml runs no gateway bootstrap).
#
# Credentials:
#   - All passwords, tokens and the JWT_HOOK_KEY PEM below are interpolated
#     from the runner environment / `.env.ci` (compose --env-file), which the
#     ci-env composite action writes from GitHub Actions repository variables
#     (vars.*). Nothing credential-like is committed in this file.
#
# Host ports (runner-local): app 3200, blaze 8080, ci-stub 8081.
# The Bruno collection runs on the runner, so those three must be host-mapped.

name: konsulin-ci

services:
  postgres:
    image: postgres:16.5-alpine
    container_name: konsulin-ci-postgres
    environment:
      POSTGRES_USER: supertokens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.ci}
      POSTGRES_DB: supertokens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [ci-net]

  redis:
    image: bitnami/redis:latest
    container_name: konsulin-ci-redis
    environment:
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.ci}
    networks: [ci-net]

  blaze:
    image: samply/blaze:latest
    container_name: konsulin-ci-blaze
    ports:
      - "8080:8080"
    environment:
      BASE_URL: "http://localhost:8080"
      CONTEXT_PATH: "/fhir"
    volumes:
      - blaze_ci_data:/app/data
    networks: [ci-net]

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: konsulin-ci-supertokens
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://supertokens:${POSTGRES_PASSWORD}@postgres:5432/supertokens"
      API_KEYS: ${SUPERTOKEN_API_KEY:?set SUPERTOKEN_API_KEY in .env.ci}
    networks: [ci-net]

  ci-stub:
    build:
      context: .
      dockerfile: scripts/ci/stub/Dockerfile
    container_name: konsulin-ci-stub
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "/ci-stub", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [ci-net]

  # Dev-mode federation gateway. pr.yml generates the signing keys and the
  # operator credential (bcrypt of a per-run random password) and runs
  # `docker compose up -d gateway` before the ci-env action starts the app;
  # scripts/ci/gateway-bootstrap.sh then enrolls both parties and enlists the
  # stub listings against it. Standalone (SQLite at /app/data) — no depends_on
  # on the infrastructure group, which is why it can start first.
  gateway:
    image: ghcr.io/konsulin-care/konsulin-gateway:0.1.2
    container_name: konsulin-ci-gateway
    ports:
      # Runner-loopback mapping for gateway-bootstrap.sh; the app container
      # reaches the service over ci-net as http://gateway:8080 instead.
      - "8082:8080"
    environment:
      APP_PORT: "8080"
      # Development mode: password-only operator login (no TOTP second
      # factor), plus the netguard escape hatch that lets the gateway call
      # the plaintext CI stub endpoints it enlists.
      APP_MODE: "development"
      APP_OUTBOUND_ALLOW_INSECURE: "1"
      # Ephemeral per-run values generated by pr.yml immediately before the
      # service starts — never committed (see ci-only synthetic values above).
      APP_GATEWAY_SIGNING_KEY: ${APP_GATEWAY_SIGNING_KEY:-}
      APP_ADMIN_SIGNING_KEY: ${APP_ADMIN_SIGNING_KEY:-}
      APP_OPERATOR_CREDENTIALS: ${APP_OPERATOR_CREDENTIALS:-}
      # SDK initialization only; the CI stub ignores the Authorization header.
      # Same repository variables the app service uses via .env.ci.
      APP_XENDIT_TOKEN: ${XENDIT_SANDBOX_API_KEY:-}
      APP_XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:-}
    healthcheck:
      # Distroless image: the gateway binary probes GET /health itself
      # (no shell, wget or curl in the image — exec form only).
      test: ["CMD", "/app/gateway", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [ci-net]

  app:
    image: konsulin/konsulin-api:pr-ci
    pull_policy: never
    container_name: konsulin-ci-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      blaze:
        condition: service_started
      supertokens:
        condition: service_started
      ci-stub:
        condition: service_healthy
    ports:
      - "3200:3200"
    environment:
      # test env: skips non-dev credential validation while keeping the
      # SuperTokens SDK behaviour identical to dev.
      APP_ENV: "test"
      # Federation — exported by scripts/ci/gateway-bootstrap.sh, which pr.yml
      # runs (into $GITHUB_ENV) before this service starts; compose picks them
      # up from the job environment here. Empty keeps standalone mode, which
      # is what security-weekly.yml (no bootstrap) relies on. APP_GATEWAY_URL
      # is the ci-net address — pr.yml rewrites it after the script emits the
      # runner-loopback URL the script itself used.
      APP_GATEWAY_URL: ${APP_GATEWAY_URL:-}
      APP_PARTY_ID: ${APP_PARTY_ID:-}
      APP_PARTY_PRIVATE_KEY: ${APP_PARTY_PRIVATE_KEY:-}
      APP_PARTY_ENC_PRIVATE_KEY: ${APP_PARTY_ENC_PRIVATE_KEY:-}
      APP_PARTY_ENROLLMENT_TOKEN: ${APP_PARTY_ENROLLMENT_TOKEN:-}
      APP_AUTOMATION_PARTY_ID: ${APP_AUTOMATION_PARTY_ID:-}
      APP_ADDRESS: "0.0.0.0"
      APP_PORT: "3200"
      APP_BASE_URL: "http://localhost:3200"
      APP_FRONTEND_DOMAIN: "http://localhost:3200"
      APP_FHIR_BASE_URL: "http://blaze:8080/fhir/"
      APP_JWT_SECRET: "ci-only-synthetic-jwt-secret-0123456789abcdef"
      # PEM injected from the JWT_HOOK_KEY environment secret (see header note);
      # signs webhook payloads inside the disposable environment only.
      JWT_HOOK_KEY: ${JWT_HOOK_KEY:?set JWT_HOOK_KEY in the environment}
      SUPERADMIN_API_KEY: ${SUPERADMIN_API_KEY:?set SUPERADMIN_API_KEY in .env.ci}
      # Magic-link delivery lands in the local stub (HOOK_URL) instead of the
      # external webhook service used by dev/prod.
      HOOK_URL: "http://ci-stub:8081/magiclink"
      HOOK_SYNC_SERVICE_NAMES: "analyze"
      SUPERTOKEN_API_KEY: ${SUPERTOKEN_API_KEY:?set SUPERTOKEN_API_KEY in .env.ci}
      SUPERTOKEN_CONNECTION_URI: "http://supertokens:3567"
      SUPERTOKEN_API_DOMAIN: "http://localhost:3200"
      SUPERTOKEN_WEBSITE_DOMAIN: "http://localhost:3200"
      APP_SUPERTOKEN_KONSULIN_DASHBOARD_ADMIN_EMAIL: "ci-superadmin@konsulin.local"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.ci}
    networks: [ci-net]

networks:
  ci-net:
    name: konsulin-ci-net

volumes:
  blaze_ci_data:
