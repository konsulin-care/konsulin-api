version: "2"
linters:
  default: none
  enable:
    - gocognit
    - gocyclo
    - goconst
    - dupl
    - govet
    - staticcheck
    - errcheck
  settings:
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    dupl:
      threshold: 50
  exclusions:
    paths:
      - ".*_test\\.go$"
      - vendor
    rules:
      # TODO: dedupe userUsecase with UserFHIRInitializerDeps (follow-up);
      # the field renames touch identity_registration.go and 4 test files.
      - path: internal/app/services/core/users/user_usecase_impl.go
        linters:
          - dupl
