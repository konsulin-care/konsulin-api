info:
  name: Register Practitioner Role
  type: http
  seq: 1

http:
  method: POST
  url: "{{process.env.APP_BASE_URL}}/api/v1/organizations/{organizationId}/roles"
  headers:
    - name: content-type
      value: application/json
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "email": "{{process.env.ORGANIZATION}}@mailinator.com"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{process.env.BASE_URL}}/api/v1/organizations/Organization/org-123/roles"
      method: POST
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{authToken}}
      body:
        type: json
        data: '{"email":"practitioner@example.com"}'
    response:
      status: 201
      body:
        type: json
        data: '{"success":true,"message":"Created","data":{"practitionerId":"Practitioner/abc","practitionerRoleId":"PractitionerRole/def","scheduleId":"Schedule/ghi"}}'
  - name: Missing email
    request:
      url: "{{process.env.BASE_URL}}/api/v1/organizations/Organization/org-123/roles"
      method: POST
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{authToken}}
      body:
        type: json
        data: "{}"
    response:
      status: 400
      body:
        type: json
        data: '{"success":false,"message":"email is required","status_code":400}'
  - name: Missing organizationId
    request:
      url: "{{process.env.BASE_URL}}/api/v1/organizations//roles"
      method: POST
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{authToken}}
      body:
        type: json
        data: '{"email":"practitioner@example.com"}'
    response:
      status: 400
      body:
        type: json
        data: '{"success":false,"message":"organizationId is required","status_code":400}'

docs: |
  Registers an existing user as a practitioner within the specified organization. Creates the FHIR PractitionerRole and generates a slot schedule.

  ### Path Parameters
  - `organizationId`: (required) FHIR Organization identifier.

  ### Request Fields
  - `email`: (required) email of the user to register as a practitioner. Must be a valid email format.

  ### Responses
  - **201 Created**: Practitioner role registered. Body: `{ "success": true, "message": "Created", "data": { "practitionerId": "...", "practitionerRoleId": "...", "scheduleId": "..." } }`.
  - **400 Bad Request**: Missing or invalid email, or missing `organizationId`. Body: `{ "success": false, "message": "...", "status_code": 400 }`.
  - **500 Internal Server Error**: Registration or FHIR resource creation failure. Body: `{ "success": false, "message": "...", "status_code": 500 }`.
