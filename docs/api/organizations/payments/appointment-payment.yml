info:
  name: Handle Appointment Payment
  type: http
  seq: 1

http:
  method: POST
  url: "{{process.env.APP_BASE_URL}}/api/v1/pay/appointment"
  headers:
    - name: content-type
      value: application/json
    - name: Authorization
      value: Bearer {{sessionToken}}
  body:
    type: json
    data: |-
      {
        "patientId": "Patient/{{patientId}}",
        "invoiceId": "Invoice/{{invoiceId}}",
        "practitionerRoleId": "PractitionerRole/{{practitionerRoleId}}",
        "slotId": "Slot/{{slotId}}",
        "appointmentId": "Appointment/{{appointmentId}}",
        "healthcareServiceId": "HealthcareService/{{healthcareServiceId}}",
        "condition": "kepala pusing dan mual sejak pagi"
      }

runtime:
  scripts:
    - type: after-response
      code: 'bru.runner.setNextRequest("Patient: Verify Appointment Booking");'
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.slot
      operator: isDefined
    - expression: res.responseTime
      operator: lt
      value: "10000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Pending payment
    request:
      url: "{{process.env.BASE_URL}}/api/v1/pay/appointment"
      method: POST
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{sessionToken}}
      body:
        type: json
        data: '{"patientId":"Patient/123","invoiceId":"Invoice/456","practitionerRoleId":"PractitionerRole/789","slotId":"Slot/012","appointmentId":"Appointment/appt-123","healthcareServiceId":"HealthcareService/345","condition":"kepala pusing dan mual sejak pagi"}'
    response:
      status: 201
      body:
        type: json
        data: '{"success":true,"message":"Payment invoice created. Please complete payment to confirm your appointment.","data":{"status":201,"message":"Payment invoice created. Please complete payment to confirm your appointment.","appointment":"Appointment/appt-123","slot":"Slot/012","paymentUrl":"https://checkout.xendit.co/inv_123","expiresAt":"2026-07-09T11:00:00Z"}}'
  - name: Validation error
    request:
      url: "{{process.env.BASE_URL}}/api/v1/pay/appointment"
      method: POST
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{sessionToken}}
      body:
        type: json
        data: '{"patientId":"invalid"}'
    response:
      status: 400
      body:
        type: json
        data: '{"success":false,"message":"patientId is required","status_code":400}'

docs: |
  Accepts a BFF-proposed appointment and starts its payment flow. Requires an authenticated session.

  ### Request Fields
  - `patientId`: (required) FHIR Patient reference (`Patient/ID`).
  - `invoiceId`: (required) FHIR Invoice reference (`Invoice/ID`).
  - `practitionerRoleId`: (required) FHIR PractitionerRole reference.
  - `slotId`: (required) FHIR Slot reference.
  - `appointmentId`: (required) FHIR Appointment reference (`Appointment/ID`) — the BFF-created `proposed` appointment to accept.
  - `healthcareServiceId`: (optional) FHIR HealthcareService reference.
  - `condition`: (optional) free-text chief complaint written by the patient
    describing their condition (e.g. "kepala pusing dan mual sejak pagi").
    Not a coded ICD-10 code. The payment bundle builder maps it to a FHIR
    `Condition` resource (`evidence[0].code[0].text`, free text inside a
    CodeableConcept, never coded) when populated; note the PAID/SETTLED
    callback path reconstructs its request from the `external_id` only, so the
    complaint is not carried into that bundle.

  ### Behavior
  - Validates the proposed appointment (status `proposed`, matching slot/participants/window) and the slot availability.
  - Reserves the slot as `busy-tentative` and moves the appointment to `pending`.
  - Creates a Xendit invoice and returns the payment URL.
  - On payment confirmation (Xendit PAID callback) the appointment becomes `booked` and the slot `busy-unavailable`.
  - On payment expiry (Xendit EXPIRED callback) the slot, invoice, and appointment are deleted.

  In the linear suite the chain verifies the reservation state in-band
  (appointment `pending`, slot `busy-tentative`) — the fully-booked pair is
  driven by the callback, which requires a real paid Xendit invoice and is
  asserted by the unit test `TestHandleAppointmentPaymentPaid_TransitionsAppointmentToBooked`.

  ### Responses
  - **201 Created**: Invoice created, payment pending. Body: `{ "success": true, "message": "Payment invoice created. Please complete payment to confirm your appointment.", "data": { "status": 201, "message": "...", "appointment": "Appointment/...", "slot": "Slot/012", "paymentUrl": "...", "expiresAt": "..." } }`.
  - **400 Bad Request**: Validation error — missing required fields, invalid reference format, or appointment not eligible for booking. Body: `{ "success": false, "message": "...", "status_code": 400 }`.
  - **404 Not Found**: The referenced appointment does not exist. Body: `{ "success": false, "message": "Appointment not found", "status_code": 404 }`.
  - **409 Conflict**: The selected slot is no longer available. Body: `{ "success": false, "message": "Selected slot is no longer available.", "status_code": 409 }`.
  - **500 Internal Server Error**: Processing failure or timeout. Body: `{ "success": false, "message": "...", "status_code": 500 }`.
