info:
  name: Mailinator Poll Inbox
  description: Polls Mailinator inbox until a message arrives for in the public inbox
  seq: 4
  type: http
http:
  method: GET
  url: https://api.mailinator.com/api/v2/domains/public/inboxes/{{process.env.MAILINATOR_INBOX}}
docs: |
  Polls the Mailinator public inbox until a message appears. The latest message ID is saved as `messageId` for the next request.

  Retries up to 3 times with 30s delay between attempts. On success, chains to
  "Get Magic Link". On exhaustion, stops the chain.

  This request replaces the inline Mailinator polling that was previously inside
  `00-magiclink.yml`'s after-response script.
runtime:
  scripts:
    - type: after-response
      code: |-
        const retries = parseInt(bru.getVar("mailinator_retry") || "0", 10);
        const body = res.getBody();
        const msgs = body && body.msgs;
        const processedIds = (bru.getVar("processedMessageIds") || "").split(",").filter(Boolean);

        if (msgs && msgs.length > 0) {
          const newest = msgs.reduce((a, b) => a.seconds_ago < b.seconds_ago ? a : b);

          if (retries > 0 && newest.seconds_ago < 60 && processedIds.indexOf(newest.id) === -1) {
            bru.setVar("messageId", newest.id);
            bru.setVar("processedMessageIds", processedIds.concat([newest.id]).join(","));
            bru.deleteVar("mailinator_retry");
            bru.runner.setNextRequest("Get Magic Link");
          } else {
            bru.setVar("mailinator_retry", String(retries + 1));
            await bru.sleep(30000);
            bru.runner.setNextRequest("Mailinator Poll Inbox");
          }
        } else if (retries < 3) {
          bru.setVar("mailinator_retry", String(retries + 1));
          await bru.sleep(30000);
          bru.runner.setNextRequest("Mailinator Poll Inbox");
        } else {
          bru.runner.setNextRequest(null);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
