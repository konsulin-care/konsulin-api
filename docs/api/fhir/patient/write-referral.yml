info:
  name: "Patient: Write Referral"
  type: http
  seq: 16
  tags: [referral]

http:
  method: PUT
  url: "{{process.env.APP_BASE_URL}}/fhir/Communication/{{referralId}}"
  headers:
    - name: If-None-Match
      value: "*"
    - name: Authorization
      value: Bearer {{sessionToken}}
  body:
    type: json
    data: |-
      {
        "resourceType": "Communication",
        "id": "{{referralId}}",
        "status": "completed",
        "topic": {
          "coding": [
            {
              "system": "http://konsulin.care/fhir/CodeSystem/research-referral",
              "code": "research-referral"
            }
          ]
        },
        "sender": {
          "reference": "Patient/{{patientId}}"
        },
        "recipient": [
          {
            "reference": "Patient/{{patientId}}"
          }
        ],
        "extension": [
          {
            "url": "http://konsulin.care/fhir/StructureDefinition/referralBatch",
            "valueReference": {
              "reference": "PlanDefinition/{{planDefinitionId}}"
            }
          }
        ]
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Patient");
        // Deterministic referral id: "referral-" + sha256(recipient|sender|batch).
        // Sender, recipient and batch must match the body below. bru.crypto is
        // not available in this Bruno version, so sha256 is implemented inline.
        function sha256(ascii) {
          function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
          var mathPow = Math.pow;
          var maxWord = mathPow(2, 32);
          var lengthProperty = "length";
          var i, j;
          var result = "";
          var words = [];
          var asciiBitLength = ascii[lengthProperty] * 8;
          var hash = sha256.h = sha256.h || [];
          var k = sha256.k = sha256.k || [];
          var primeCounter = k[lengthProperty];
          var isComposite = {};
          for (var candidate = 2; primeCounter < 64; candidate++) {
            if (!isComposite[candidate]) {
              for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
              hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
              k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
            }
          }
          ascii += "\x80";
          while (ascii[lengthProperty] % 64 - 56) ascii += "\x00";
          for (i = 0; i < ascii[lengthProperty]; i++) {
            j = ascii.charCodeAt(i);
            if (j >> 8) return "";
            words[i >> 2] |= j << ((3 - i) % 4) * 8;
          }
          words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
          words[words[lengthProperty]] = (asciiBitLength);
          for (j = 0; j < words[lengthProperty];) {
            var w = words.slice(j, j += 16);
            var oldHash = hash.slice(0, 8);
            for (i = 0; i < 64; i++) {
              var w15 = w[i - 15], w2 = w[i - 2];
              var a = hash[0], e = hash[4];
              var temp1 = hash[7]
                + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                + ((e & hash[5]) ^ ((~e) & hash[6]))
                + k[i]
                + (w[i] = (i < 16) ? w[i] : (
                    w[i - 16]
                    + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                    + w[i - 7]
                    + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                  ) | 0);
              var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
              hash = [(temp1 + temp2) | 0].concat(hash);
              hash[4] = (hash[4] + temp1) | 0;
            }
            for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
          }
          for (i = 0; i < 8; i++) {
            for (j = 3; j + 1; j--) {
              var b = (hash[i] >> (j * 8)) & 255;
              result += ((b < 16) ? 0 : "") + b.toString(16);
            }
          }
          return result;
        }
        var hash = sha256(bru.getVar("patientId") + "|" + bru.getVar("patientId") + "|" + bru.getVar("planDefinitionId"));
        bru.setVar("referralId", "referral-" + hash);
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: 'bru.runner.setNextRequest("Patient: Get Circle Stats");'
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Writes a referral Communication with a deterministic id
  (`referral-` + sha256 of `recipient|sender|batch`, computed in the
  pre-request script) and `If-None-Match: *` for idempotency — 201 on first
  write, 409 when it already exists. The backend re-validates the id, the
  research-referral topic, the batch extension (must reference the seeded
  PlanDefinition) and that the sender resolves to a registered Patient.

  NOTE: referral writes are patient-only — the Auth middleware rejects them
  when the session also carries the Practitioner role (our demo session does),
  so the expected status here is 403. The assertion pins this behavior; the
  request is the correct API shape. Pre-request switches to Patient.
