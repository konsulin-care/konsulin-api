info:
  name: "Patient: Get Completion Total"
  type: http
  seq: 6
  tags: [PR, research, assessment]

http:
  method: GET
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir/QuestionnaireResponse?_summary=count&questionnaire={{process.env.APP_BASE_URL}}/fhir/Questionnaire/{{questionnaireId}}"
  params:
    - name: _summary
      value: count
      type: query
    - name: questionnaire
      value: "{{process.env.APP_BASE_URL}}/fhir/Questionnaire/{{questionnaireId}}"
      type: query

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Patient");
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: 'bru.runner.setNextRequest("Patient: Get Questionnaire Detail");'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Aggregate completion count for a questionnaire (`_summary=count`) — public
  social-proof data (the scoped-read rule exempts `_summary=count` queries).
  Pre-request switches to Patient.
