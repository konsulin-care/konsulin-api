info:
  name: "Patient: Get Profile"
  type: http
  seq: 1
  tags: [profile]

http:
  method: GET
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir/Patient?identifier=https://login.konsulin.care/userid|{{userId}}"
  params:
    - name: identifier
      value: "https://login.konsulin.care/userid|{{userId}}"
      type: query

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Patient");
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: |-
        // Identity capture (patientId) happens in "Check Email Exists" — the
        // magic-link flow creates profiles synchronously and the response
        // carries the ids. This request documents the identifier-based profile
        // lookup; it must not overwrite patientId, because an unresolved
        // userId makes the search match unrelated patients.
        bru.runner.setNextRequest("Patient: List Research Studies");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Resolves the session user's Patient profile by the SuperTokens login
  identifier (`https://login.konsulin.care/userid|<userId>`, created by the
  magic-link flow). Identity capture for the journey (`patientId`) happens in
  "Check Email Exists", whose response carries the FHIR ids; this request only
  demonstrates the lookup and does not overwrite `patientId` (an unresolved
  `userId` would make the identifier search match unrelated patients).

  Pre-request switches the active role to Patient.
