info:
  name: "Patient: Submit Questionnaire Response"
  type: http
  seq: 8
  tags: [assessment]

http:
  method: POST
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir/QuestionnaireResponse"
  body:
    type: json
    data: |-
      {
        "resourceType": "QuestionnaireResponse",
        "status": "completed",
        "questionnaire": "{{process.env.APP_BASE_URL}}/fhir/Questionnaire/{{questionnaireId}}",
        "author": {
          "reference": "Patient/{{patientId}}"
        },
        "subject": {
          "reference": "Patient/{{patientId}}"
        },
        "authored": "{{now}}",
        "item": [
          {
            "linkId": "q1",
            "text": "How would you rate your overall wellbeing?",
            "answer": [
              {
                "valueCoding": {
                  "code": "3",
                  "display": "Good"
                }
              }
            ]
          }
        ]
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Patient");
        bru.setVar("now", new Date().toISOString());
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("questionnaireResponseId", body.id);
        bru.runner.setNextRequest("Patient: List Record Summary");
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Submits a completed QuestionnaireResponse for the seeded questionnaire
  (author + subject = the session patient). Captures `questionnaireResponseId`.
  Pre-request switches to Patient and stamps `now`.
