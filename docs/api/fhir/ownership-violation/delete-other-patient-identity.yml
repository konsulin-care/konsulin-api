info:
  name: "Ownership Violation: Delete Other Patient's Identity"
  type: http
  seq: 13
  tags: [ownership]

http:
  method: DELETE
  url: "{{process.env.APP_BASE_URL}}/fhir/Patient/other-patient-b"
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Patient");
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: 'bru.runner.setNextRequest("Ownership Violation: Cleanup Seeded Identities");'
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Expected failure: the session DELETEs Patient B by path id. RBAC grants
  Patient DELETE /fhir/Patient, but the ownership engine's identity branch
  (`ValidSearchQuery`) requires the path id to be owned — it is not — 401.
  Patient B is untouched (the cleanup request removes it via Blaze).
