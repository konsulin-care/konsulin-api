info:
  name: "Ownership Violation: Delete Other Practitioner"
  type: http
  seq: 16
  tags: [ownership]

http:
  method: DELETE
  url: "{{process.env.APP_BASE_URL}}/fhir/Practitioner/other-practitioner-x"
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Practitioner");
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: 'bru.runner.setNextRequest("Ownership Violation: Delete Other Patient''s Identity");'
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Expected failure: a Practitioner DELETE of another practitioner's identity
  by path id. RBAC grants Practitioner DELETE /fhir/Practitioner, but the
  10126d2 mutating-query gate requires the path id to be the caller's own —
  401. Symmetric identity coverage (the Patient path-id variant is covered by
  "Delete Other Patient's Identity"); this was 401 before the fix too.
