info:
  name: "Ownership Violation: Read Email Shared Condition"
  type: http
  seq: 13
  tags: [ownership]

http:
  method: GET
  url: "{{process.env.APP_BASE_URL}}/fhir/Condition/email-shared-condition"
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Practitioner");
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: 'bru.runner.setNextRequest("Ownership Violation: Read Appointment Include Drops Stranger");'
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Expected failure: the session reads a Condition whose subject is
  `Patient/email-shared-patient` — a record carrying the session's own email
  address. 79cecaf deleted `resolveRelatedPatientIDsByEmail`: practitioner
  seeding now matches the SuperTokens identifier only, so the shared email
  grants nothing and the read is denied — 401. Before 79cecaf the email
  matcher would have seeded this patient at full fidelity and the read
  returned 200. If this ever returns 200, check the practitioner record's
  telecom email and the `email-shared-patient` supertoken identifier first.
