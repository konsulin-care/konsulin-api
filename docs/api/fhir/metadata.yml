info:
  name: FHIR Server Metadata
  type: http
http:
  method: GET
  url: "{{BASE_URL}}/fhir/metadata"
  headers:
    - name: accept
      value: application/fhir+json
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers["content-type"]
      operator: contains
      value: "application/fhir+json"
    - expression: res.body.resourceType
      operator: isDefined
    - expression: res.body.resourceType
      operator: eq
      value: "CapabilityStatement"
    - expression: res.body.publisher
      operator: isDefined
    - expression: res.responseTime
      operator: lt
      value: "5000"
