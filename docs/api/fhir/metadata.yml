info:
  name: FHIR Server Metadata
  type: http
  seq: 1

http:
  method: GET
  url: "{{process.env.APP_BASE_URL}}/fhir/metadata"
  headers:
    - name: accept
      value: application/fhir+json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/fhir+json
    - expression: res.body.resourceType
      operator: isDefined
    - expression: res.body.resourceType
      operator: eq
      value: CapabilityStatement
    - expression: res.body.publisher
      operator: isDefined
    - expression: res.responseTime
      operator: lt
      value: "5000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
