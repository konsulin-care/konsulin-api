info:
  name: List All Clinic Locations
  type: http
  seq: 2
  tags: [clinic]

http:
  method: GET
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir/Location"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const ids = body.entry.map(e => e.resource.id);

        // Pick a random ID
        const randomId = ids[Math.floor(Math.random() * ids.length)];

        // Save to a variable for use in subsequent requests
        bru.setVar("locationId", randomId);
        bru.setNextRequest("List Practitioners in a Clinic")

        console.log("Available IDs:", ids);
        console.log("Selected ID:", randomId);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Lists all clinic Locations (public read). Picks a random Location id, stores
  it as `locationId`, and chains to "List Practitioners in a Clinic".
