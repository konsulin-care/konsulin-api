info:
  name: FHIR Server Metadata
  type: http
  seq: 1
  tags: [utility]

http:
  method: GET
  url: "{{process.env.APP_BASE_URL}}/fhir/metadata"
  headers:
    - name: accept
      value: application/fhir+json

runtime:
  assertions:
    - expression: res.body.resourceType
      operator: isDefined
    - expression: res.body.resourceType
      operator: eq
      value: CapabilityStatement
    - expression: res.body.publisher
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Read-only capability statement of the FHIR proxy target (Blaze). Returns the
  supported FHIR version, resources and interactions. Standalone — does not
  chain.
