info:
  name: "Practitioner: Get Profile"
  type: http
  seq: 1
  tags: [profile]

http:
  method: GET
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir/Practitioner?identifier=https://login.konsulin.care/userid|{{userId}}"
  params:
    - name: identifier
      value: "https://login.konsulin.care/userid|{{userId}}"
      type: query

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Practitioner");
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: |-
        // practitionerId is captured in "Check Email Exists" (the magic-link
        // flow creates profiles synchronously). This request documents the
        // identifier-based lookup and must not overwrite it with an ambiguous
        // search result.
        bru.runner.setNextRequest("Practitioner: Get Roles");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Resolves the session user's Practitioner profile by the SuperTokens login
  identifier (created by the magic-link flow; `practitionerId` is captured
  earlier by "Check Email Exists"). Demonstrates the lookup without
  overwriting the captured id. Pre-request switches to Practitioner.
