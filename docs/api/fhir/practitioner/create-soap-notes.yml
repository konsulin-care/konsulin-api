info:
  name: "Practitioner: Create SOAP Notes"
  type: http
  seq: 9
  tags: [PR, assessment]

http:
  method: POST
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir"
  body:
    type: json
    data: |-
      {
        "resourceType": "Bundle",
        "type": "transaction",
        "entry": [
          {
            "request": {
              "method": "POST",
              "url": "QuestionnaireResponse"
            },
            "resource": {
              "resourceType": "QuestionnaireResponse",
              "status": "completed",
              "questionnaire": "{{process.env.APP_BASE_URL}}/fhir/Questionnaire/seed-soap",
              "author": {
                "reference": "Practitioner/{{practitionerId}}"
              },
              "subject": {
                "reference": "Patient/{{patientId}}"
              },
              "authored": "{{now}}",
              "item": [
                {
                  "linkId": "subjective",
                  "text": "Subjective",
                  "answer": [
                    {
                      "valueString": "Patient reports improved mood this week."
                    }
                  ]
                },
                {
                  "linkId": "objective",
                  "text": "Objective",
                  "answer": [
                    {
                      "valueString": "Vitals within normal range."
                    }
                  ]
                },
                {
                  "linkId": "assessment",
                  "text": "Assessment",
                  "answer": [
                    {
                      "valueString": "Responding well to the wellbeing plan."
                    }
                  ]
                },
                {
                  "linkId": "plan",
                  "text": "Plan",
                  "answer": [
                    {
                      "valueString": "Continue weekly check-ins; follow up in 2 weeks."
                    }
                  ]
                }
              ]
            }
          }
        ]
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Practitioner");
        bru.setVar("now", new Date().toISOString());
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body.entry) {
          // Blaze transaction responses carry created ids in response.location.
          for (const e of body.entry) {
            const loc = (e.response && e.response.location) || "";
            const parts = loc.split("/");
            const type = parts[parts.length - 4];
            const id = parts[parts.length - 3];
            if (type === "QuestionnaireResponse") { bru.setVar("soapQuestionnaireResponseId", id); }
          }
        }
        bru.runner.setNextRequest("Admin: Create Questionnaire Draft");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Submits the SOAP consultation notes for the booked patient: a transaction
  bundle creating a completed QuestionnaireResponse against the `seed-soap`
  questionnaire (the suite's own copy — the real `soap` questionnaire on a dev
  Blaze is never written or deleted by the collection), authored by the
  practitioner and subject to the patient. Hand-off to the admin phase.
  Pre-request switches to Practitioner and stamps `now`.
