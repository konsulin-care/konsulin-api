info:
  name: "Practitioner: List Practitioner Slots"
  type: http
  seq: 4
  tags: [appointment]

http:
  method: GET
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir/Slot?_has:Appointment:slot:practitioner={{practitionerId}}&start=ge{{nowIso}}"
  params:
    - name: _has:Appointment:slot:practitioner
      value: "{{practitionerId}}"
      type: query
    - name: start
      value: "ge{{nowIso}}"
      type: query

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Practitioner");
        bru.setVar("nowIso", new Date().toISOString());
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: 'bru.runner.setNextRequest("Practitioner: Get Busy Slots");'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Slots that already have appointments for this practitioner, via the
  reverse-include `_has:Appointment:slot:practitioner`. After the patient
  booking step, the busy-tentative slot created there appears. Pre-request
  switches to Practitioner and stamps `nowIso`.
