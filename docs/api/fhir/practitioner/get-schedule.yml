info:
  name: "Practitioner: Get Schedule"
  type: http
  seq: 3
  tags: [PR, appointment]

http:
  method: GET
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir/Schedule?actor=PractitionerRole/{{practitionerRoleId}}"
  params:
    - name: actor
      value: "PractitionerRole/{{practitionerRoleId}}"
      type: query

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Practitioner");
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: 'bru.runner.setNextRequest("Practitioner: List Practitioner Slots");'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Fetches the practitioner's Schedule by role actor (booking context). Returns
  the seeded Schedule. Pre-request switches to Practitioner.
