info:
  name: Seed Plan Definition
  type: http
  seq: 8
  tags: [PR, research, utility]

http:
  method: PUT
  url: "{{process.env.BLAZE_BASE_URL}}/fhir/PlanDefinition/seed-protocol"
  body:
    type: json
    data: |-
      {
        "resourceType": "PlanDefinition",
        "id": "seed-protocol",
        "status": "active",
        "title": "Wellbeing Check-in Protocol",
        "description": "Weekly wellbeing assessment protocol for the research study.",
        "type": {
          "coding": [
            {
              "system": "http://terminology.hl7.org/CodeSystem/plan-definition-type",
              "code": "clinical-protocol"
            }
          ]
        },
        "action": [
          {
            "title": "Complete weekly wellbeing questionnaire",
            "definitionCanonical": "{{process.env.BLAZE_BASE_URL}}/fhir/Questionnaire/{{questionnaireId}}"
          }
        ]
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("planDefinitionId", body.id);
        bru.runner.setNextRequest("Seed Research Study");
  assertions:
    - expression: res.status
      operator: gte
      value: "200"
    - expression: res.status
      operator: lte
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Seeds the research protocol PlanDefinition (fixed id `seed-protocol`,
  idempotent PUT) referenced by the ResearchStudy (`_include=ResearchStudy:protocol`
  pulls it into study listings). Captures `planDefinitionId` (equals
  seed-protocol) and chains to "Seed Research Study". Direct Blaze PUT..
