info:
  name: Seed Organization
  type: http
  seq: 1
  tags: [clinic, utility]

http:
  method: PUT
  url: "{{process.env.APP_BASE_URL}}/fhir/Organization/seed-clinic"
  headers:
    - name: X-API-Key
      value: "{{process.env.SUPERADMIN_API_KEY}}"
  body:
    type: json
    data: |-
      {
        "resourceType": "Organization",
        "id": "seed-clinic",
        "active": true,
        "name": "Konsulin Demo Clinic",
        "type": [
          {
            "coding": [
              {
                "system": "http://terminology.hl7.org/CodeSystem/organization-type",
                "code": "prov",
                "display": "Healthcare Provider"
              }
            ]
          }
        ],
        "address": [
          {
            "city": "Jakarta",
            "country": "ID"
          }
        ]
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("organizationId", body.id);
        bru.runner.setNextRequest("Seed Location");
  assertions:
    - expression: res.status
      operator: gte
      value: "200"
    - expression: res.status
      operator: lte
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Seeds the clinic Organization as superadmin (X-API-Key) with the fixed id
  `seed-clinic` via PUT — idempotent across runs (Blaze ignores client-supplied
  ids on POST, so PUT is required for a deterministic id). Captures
  `organizationId` (equals seed-clinic) and chains to "Seed Location".
  Organization PUT is Superadmin-only in the RBAC policy, which is why seeding
  runs with the API key.
