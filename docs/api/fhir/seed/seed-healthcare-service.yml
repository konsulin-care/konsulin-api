info:
  name: Seed Healthcare Service
  type: http
  seq: 3
  tags: [clinic, utility]

http:
  method: POST
  url: "{{process.env.APP_BASE_URL}}/fhir/HealthcareService"
  headers:
    - name: X-API-Key
      value: "{{process.env.SUPERADMIN_API_KEY}}"
  body:
    type: json
    data: |-
      {
        "resourceType": "HealthcareService",
        "active": true,
        "providedBy": {
          "reference": "Organization/{{organizationId}}"
        },
        "location": [
          {
            "reference": "Location/{{locationId}}"
          }
        ],
        "name": "Konsulin Tele-Consultation",
        "type": [
          {
            "coding": [
              {
                "system": "http://snomed.info/sct",
                "code": "394602003",
                "display": "General practice"
              }
            ],
            "text": "Consultation"
          }
        ],
        "extension": [
          {
            "url": "https://konsulin.care/StructureDefinition/appointment-duration",
            "valueDuration": {
              "value": 30,
              "unit": "minutes",
              "code": "min"
            }
          },
          {
            "url": "https://konsulin.care/StructureDefinition/service-fee",
            "valueMoney": {
              "value": 150000,
              "currency": "IDR"
            }
          }
        ]
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("healthcareServiceId", body.id);
        bru.runner.setNextRequest("Seed Practitioner Role");
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Seeds the HealthcareService for the clinic. Its `appointment-duration`
  extension (30 minutes) is what clients use to size slots in the dynamic
  availability model; the fee extension feeds the payment flow. Captures
  `healthcareServiceId` and chains to "Seed Practitioner Role". Superadmin.
