info:
  name: List All Clinic Locations
  type: http
  seq: 2

http:
  method: GET
  url: "{{process.env.APP_BASE_URL}}/fhir/Location"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const ids = body.entry.map(e => e.resource.id);

        // Pick a random ID
        const randomId = ids[Math.floor(Math.random() * ids.length)];

        // Save to a variable for use in subsequent requests
        bru.setVar("locationId", randomId);
        bru.setNextRequest("List Practitioners in a Clinic")

        console.log("Available IDs:", ids);
        console.log("Selected ID:", randomId);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
