info:
  name: "Cleanup: Delete Practitioner Profile"
  type: http
  seq: 2
  tags: [utility]

http:
  method: DELETE
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
  url: "{{process.env.APP_BASE_URL}}/fhir/Practitioner/{{practitionerId}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("activeRole", "Practitioner");
        await bru.sendRequest({
          method: "POST",
          url: bru.getProcessEnv("APP_BASE_URL") + "/api/v1/auth/active-role",
          headers: {
            "content-type": "application/json",
            "Authorization": "Bearer " + bru.getVar("sessionToken")
          },
          data: JSON.stringify({ role: bru.getVar("activeRole") })
        }, function(err, res) {
          if (err) {
            console.error("role switch failed: " + err.message);
          } else if (res && res.headers) {
            // the active-role response carries the regenerated access token;
            // capture it so the following request sees the new active role
            var newToken = res.headers["st-access-token"] || res.headers["front-token"];
            if (newToken) { bru.setVar("sessionToken", newToken); }
          }
        });
    - type: after-response
      code: 'bru.runner.setNextRequest("Cleanup: Delete Patient Profile");'
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Deletes the session user's Practitioner profile (RBAC grants Practitioner
  DELETE on `/fhir/Practitioner`, ownership-checked to the caller's own id).
  Must run after all practitioner-scoped FHIR work; the preceding Blaze-direct
  purge removes referencing resources, so the DELETE succeeds with 200.
  Pre-request switches to Practitioner. Chains to the Patient profile
  deletion.
