info:
  name: Service Request Callback
  description: Receives async service result callbacks from external services
  type: http
http:
  method: POST
  url: "{{BASE_URL}}/api/v1/callback/service-request"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "serviceRequestId": "sr_abc123",
        "result": "{\"status\":\"completed\",\"output\":\"...\"}",
        "timestamp": "2026-07-09T10:30:00Z"
      }
docs: |
  Receives asynchronous service result callbacks from external services. Stores the result against the original service request for later retrieval.

  ### Request Fields
  - `serviceRequestId`: (required) the async service request identifier.
  - `result`: (required) the result payload as a JSON string.
  - `timestamp`: (required) RFC3339 timestamp of when the result was produced.

  ### Responses
  - **200 OK**: Callback processed successfully. No body.
  - **400 Bad Request**: Missing required fields or invalid timestamp format. Body: `{ "success": false, "message": "...", "status_code": 400 }`.
  - **405 Method Not Allowed**: Non-POST request. Body: `{ "success": false, "message": "Only POST is allowed", "status_code": 405 }`.
  - **415 Unsupported Media Type**: Content-Type is not `application/json`. Body: `{ "success": false, "message": "Content-Type must be application/json", "status_code": 415 }`.
  - **500 Internal Server Error**: Storage failure. Body: `{ "success": false, "message": "...", "status_code": 500 }`.
examples:
  - name: Success
    request:
      method: POST
      url: "{{BASE_URL}}/api/v1/callback/service-request"
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: '{"serviceRequestId":"sr_abc123","result":"{\"status\":\"completed\"}","timestamp":"2026-07-09T10:30:00Z"}'
    response:
      status: 200
      body:
        type: json
        data: ""
  - name: Missing fields
    request:
      method: POST
      url: "{{BASE_URL}}/api/v1/callback/service-request"
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: '{"serviceRequestId":"sr_abc123"}'
    response:
      status: 400
      body:
        type: json
        data: '{"success":false,"message":"result is required","status_code":400}'
