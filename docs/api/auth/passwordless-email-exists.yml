info:
  name: Check Email Exists
  type: http
  seq: 2
  tags: [PR, auth]

http:
  method: GET
  url: "{{process.env.APP_BASE_URL}}/api/v1/auth/passwordless/email/exists?email={{process.env.ORGANIZATION}}@mailinator.com"
  headers:
    - name: content-type
      value: application/json
  params:
    - name: email
      value: "{{process.env.ORGANIZATION}}@mailinator.com"
      type: query

runtime:
  scripts:
    - type: after-response
      code: |-
        // The magic-link flow creates FHIR profiles synchronously, so the
        // response carries the session user's Patient/Practitioner ids.
        const body = res.getBody();
        if (body && body.patientIds && body.patientIds.length > 0) {
          bru.setVar("patientId", String(body.patientIds[0]).replace("Patient/", ""));
        }
        if (body && body.practitionerIds && body.practitionerIds.length > 0) {
          bru.setVar("practitionerId", String(body.practitionerIds[0]).replace("Practitioner/", ""));
        }
        bru.runner.setNextRequest("Create Anonymous Session");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: OK
    - expression: res.body.exists
      operator: isDefined
    - expression: res.responseTime
      operator: lt
      value: "5000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: User exists
    request:
      url: "{{process.env.BASE_URL}}/api/v1/auth/passwordless/email/exists?email=konsulin@mailinator.com"
      method: GET
      headers:
        - name: content-type
          value: application/json
    response:
      status: 200
      body:
        type: json
        data: '{"exists":true,"status":"OK","patientIds":["Patient/1"],"practitionerIds":[]}'
  - name: User not found
    request:
      url: "{{process.env.BASE_URL}}/api/v1/auth/passwordless/email/exists?email=unknown@example.com"
      method: GET
      headers:
        - name: content-type
          value: application/json
    response:
      status: 200
      body:
        type: json
        data: '{"exists":false,"status":"OK","patientIds":[],"practitionerIds":[]}'
  - name: Missing email
    request:
      url: "{{process.env.BASE_URL}}/api/v1/auth/passwordless/email/exists"
      method: GET
      headers:
        - name: content-type
          value: application/json
    response:
      status: 400
      body:
        type: json
        data: '{"success":false,"message":"email is required","status_code":400}'

docs: |
  Checks if a SuperTokens passwordless user exists for the given email.

  This request runs immediately after "Send Magic Link" while the email is still
  in transit to Mailinator. It has no dependencies on magic link params. Its
  response carries the session user's FHIR `patientIds`/`practitionerIds` (created
  synchronously by the magic-link flow); those are captured as `patientId` and
  `practitionerId` for the seed phase.

  On completion, chains to "Create Anonymous Session".

  ### Query Parameters
  - `email`: (required) `konsulin@mailinator.com`.

  ### Responses
  - **200 OK**: Lookup completed. Body: `{ "exists": true|false, "status": "OK", "patientIds": [...], "practitionerIds": [...] }`.
  - **400 Bad Request**: Missing `email` query parameter. Body: `{ "success": false, "message": "email is required", "status_code": 400 }`.
  - **500 Internal Server Error**: Server failure.
