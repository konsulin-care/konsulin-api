info:
  name: Debug Session3
  description: Tests if cookies are accessible via API
  type: http
http:
  method: POST
  url: "{{BASE_URL}}/api/v1/auth/signinup/code/consume"
  headers:
    - name: content-type
      value: application/json
    - name: st-auth-mode
      value: cookie
  body:
    type: json
    data: |-
      {
        "preAuthSessionId": "{{preAuthSessionId}}",
        "linkCode": "{{linkCode}}"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Status: " + res.status);
        var jar = bru.cookies.jar();
        console.log("jar: " + (jar ? jar : "null"));
        if (jar) {
          var url = bru.getVar("BASE_URL") || "http://localhost:3200";
          console.log("URL: " + url);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
