info:
  name: 06 - Logout
  description: Logs out the current user by revoking their session (last endpoint)
  type: http
http:
  method: POST
  url: "{{process.env.BASE_URL}}/api/v1/auth/logout"
  headers:
    - name: content-type
      value: application/json
    - name: Authorization
      value: Bearer {{sessionToken}}
  body:
    type: json
    data: "{}"
docs: |
  Revokes the current session and logs the user out. This endpoint uses the `Authenticate`
  middleware which expects a custom Redis-backed JWT (signed with the internal JWT secret),
  not the SuperTokens access token. The `{{sessionToken}}` from `01-consume-code.yml` is
  a SuperTokens St-Access-Token, so this endpoint may still return 401.

  This is intentionally the last endpoint in the auth flow (alphabetical ordering).
  It serves as documentation for the endpoint contract rather than a guaranteed passing test.

  ### Responses
  - **200 OK**: Logout successful. Body: `{ "success": true, "message": "logout success" }`.
  - **401 Unauthorized**: Invalid or missing auth token. Body: `{ "success": false, "message": "...", "status_code": 401 }`.
  - **500 Internal Server Error**: Server failure.
examples:
  - name: Success
    request:
      method: POST
      url: "{{process.env.BASE_URL}}/api/v1/auth/logout"
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{sessionToken}}
    response:
      status: 200
      body:
        type: json
        data: '{"success":true,"message":"logout success"}'
  - name: No session
    request:
      method: POST
      url: "{{process.env.BASE_URL}}/api/v1/auth/logout"
      headers:
        - name: content-type
          value: application/json
    response:
      status: 401
      body:
        type: json
        data: '{"success":false,"message":"Unauthenticated","status_code":401}'
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Logout response status: " + res.status);
