info:
  name: 03 - Claim Anonymous Resources
  description: Transfers anonymous session resources to an authenticated user
  type: http
http:
  method: PATCH
  url: "{{process.env.BASE_URL}}/api/v1/auth/anonymous/claim"
  headers:
    - name: content-type
      value: application/json
    - name: Authorization
      value: Bearer {{sessionToken}}
  body:
    type: json
    data: "{}"
docs: |
  Transfers resources created during an anonymous session to the currently authenticated SuperTokens user. Requires a valid SuperTokens session (`Authorization: Bearer {{sessionToken}}`) and an existing anonymous session cookie.

  ### Responses
  - **200 OK**: Resources claimed successfully. Body: `{ "success": true, "message": "Anonymous resources claimed successfully", "data": { "claimed": true, "count": 3, "referenceList": [...] } }`.
  - **204 No Content**: No anonymous session cookie present — nothing to claim.
  - **400 Bad Request**: Missing or anonymous user in context. Body: `{ "success": false, "message": "Session not found", "status_code": 400 }`.
  - **500 Internal Server Error**: Server failure.
examples:
  - name: Success
    request:
      method: PATCH
      url: "{{process.env.BASE_URL}}/api/v1/auth/anonymous/claim"
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{sessionToken}}
    response:
      status: 200
      body:
        type: json
        data: '{"success":true,"message":"Anonymous resources claimed successfully","data":{"claimed":true,"count":3,"referenceList":["QuestionnaireResponse/1","Observation/2"]}}'
  - name: No anonymous cookie
    request:
      method: PATCH
      url: "{{process.env.BASE_URL}}/api/v1/auth/anonymous/claim"
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{sessionToken}}
    response:
      status: 204
      body:
        type: json
        data: ""
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("03-anonymous-claim: sessionToken=" + (bru.getVar("sessionToken") || "UNDEFINED") + " (first 20: " + (bru.getVar("sessionToken") || "").substring(0,20) + ")");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.claimed
      operator: eq
      value: "true"
    - expression: res.responseTime
      operator: lt
      value: "5000"
