info:
  name: Sign Out
  description: Sign out the user from the current SuperTokens session
  seq: 9
  type: http
http:
  method: POST
  url: "{{process.env.BASE_URL}}/api/v1/auth/signout"
  headers:
    - name: content-type
      value: application/json
    - name: Authorization
      value: Bearer {{sessionToken}}
  body:
    type: json
    data: "{}"
docs: |
  Logs out the user from the current SuperTokens session. Requires a valid
  SuperTokens session via `Authorization: Bearer {{sessionToken}}`.

  This is the final request in the auth test chain. Sets `setNextRequest(null)`
  to stop the runner.

  ### Responses
  - **200 OK**: Logout successful.
  - **401 Unauthorized**: No valid session.
examples:
  - name: Success
    request:
      method: POST
      url: "{{process.env.BASE_URL}}/api/v1/auth/logout"
      headers:
        - name: content-type
          value: application/json
        - name: Authorization
          value: Bearer {{sessionToken}}
    response:
      status: 200
      body:
        type: json
        data: "{}"
runtime:
  scripts:
    - type: after-response
      code: |-
        bru.runner.setNextRequest(null);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.responseTime
      operator: lt
      value: "5000"
