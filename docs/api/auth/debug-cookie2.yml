info:
  name: Debug Cookie 2
  description: Tests Bruno cookie jar and set-cookie visibility
  type: http
http:
  method: POST
  url: "{{process.env.BASE_URL}}/api/v1/auth/signinup/code/consume"
  headers:
    - name: content-type
      value: application/json
    - name: st-auth-mode
      value: cookie
  body:
    type: json
    data: |-
      {
        "preAuthSessionId": "{{preAuthSessionId}}",
        "linkCode": "{{linkCode}}"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Status: " + res.status);
        console.log("--- res.headerList ---");
        console.log("Total headers: " + res.headerList.count());
        res.headerList.each(function(h, i) {
          console.log("  [" + i + "] " + h.key + ": " + h.value);
        });
        console.log("--- res.headers ---");
        var keys = Object.keys(res.headers);
        console.log("Header keys (" + keys.length + "): " + keys.join(", "));
        console.log("--- bru.cookies ---");
        console.log("Cookie count: " + bru.cookies.count());
        var sAccess = bru.cookies.get("sAccessToken");
        console.log("sAccessToken cookie: " + sAccess);
        console.log("Has sAccessToken: " + bru.cookies.has("sAccessToken"));
        bru.cookies.each(function(c) {
          console.log("  Cookie: " + c.key + " = " + c.value);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
