info:
  name: Debug Cookie
  description: Checks if Bruno sees Set-Cookie headers in consume-code response
  type: http
http:
  method: POST
  url: "{{BASE_URL}}/api/v1/auth/signinup/code/consume"
  headers:
    - name: content-type
      value: application/json
    - name: st-auth-mode
      value: cookie
  body:
    type: json
    data: |-
      {
        "preAuthSessionId": "{{preAuthSessionId}}",
        "linkCode": "{{linkCode}}"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Status: " + res.status);
        if (res.headers) {
          var keys = Object.keys(res.headers);
          console.log("Header keys: " + keys.join(", "));
          for (var i = 0; i < keys.length; i++) {
            var key = keys[i];
            var val = res.headers[key];
            if (key.toLowerCase() === "set-cookie") {
              console.log("  " + key + ": " + val);
              if (typeof val === "string") {
                var match = val.match(/sAccessToken=([^;]+)/);
                if (match) {
                  bru.setVar("sessionToken", match[1]);
                  console.log("Saved sAccessToken from cookie!");
                }
              }
            }
          }
        }
        console.log("sessionToken set: " + (bru.getVar("sessionToken") ? "YES" : "NO"));
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
