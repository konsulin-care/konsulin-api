info:
  name: Send Magic Link
  description: Sends a passwordless magic link to konsulin@mailinator.com with all roles
  type: http
http:
  method: POST
  url: "{{process.env.BASE_URL}}/api/v1/auth/magiclink"
  headers:
    - name: content-type
      value: application/json
    - name: X-API-Key
      value: "{{process.env.SUPERADMIN_API_KEY}}"
  body:
    type: json
    data: |-
      {
        "email": "konsulin@mailinator.com",
        "roles": ["Patient", "Practitioner", "Clinic Admin", "Researcher"]
      }
docs: |
  Initiates a passwordless magic link flow via SuperTokens for konsulin@mailinator.com.
  The link is sent to the Mailinator public inbox. After sending, the after-response
  script polls Mailinator (up to 3 retries with exponential backoff: 30s, 60s, 120s)
  to retrieve the latest email, extract the magic link URL, and save preAuthSessionId
  and linkCode as collection variables for the subsequent consume-code step.

  ### Request Fields
  - `email`: `konsulin@mailinator.com` — Mailinator public inbox for automated retrieval.
  - `roles`: All four roles are assigned to enable testing across RBAC scenarios.

  ### Responses
  - **200 OK**: Magic link generated. Body: `{ "success": true, "message": "magic link successfully generated" }`.
  - **400 Bad Request**: Validation error. Body: `{ "success": false, "message": "...", "status_code": 400 }`.
  - **500 Internal Server Error**: Server failure. Body: `{ "success": false, "message": "...", "status_code": 500 }`.
examples:
  - name: Success
    request:
      method: POST
      url: "{{process.env.BASE_URL}}/api/v1/auth/magiclink"
      headers:
        - name: content-type
          value: application/json
        - name: X-API-Key
          value: "{{process.env.SUPERADMIN_API_KEY}}"
      body:
        type: json
        data: '{"email":"konsulin@mailinator.com","roles":["Patient","Practitioner","Clinic Admin","Researcher"]}'
    response:
      status: 200
      body:
        type: json
        data: '{"success":true,"message":"magic link successfully generated"}'
runtime:
  scripts:
    - type: after-response
      code: |-
        var retries = 0;
        var maxRetries = 3;
        var delays = [30000, 60000, 120000];

        function fetchAndParse(retry) {
          if (retry >= maxRetries) {
            bru.setVar("debug_status", "max_retries");
            console.log("Mailinator: max retries reached, giving up");
            bru.cb();
            return;
          }

          setTimeout(function() {
            bru.setVar("debug_timer_fired", String(retry));
            $.ajax({
              url: "https://api.mailinator.com/api/v2/domains/public/inboxes/konsulin",
              method: "GET",
              success: function(data) {
                var messages = data.messages;
                bru.setVar("debug_inbox_msgs", String(messages ? messages.length : 0));
                console.log("Mailinator: inbox has " + (messages ? messages.length : 0) + " messages");
                if (messages && messages.length > 0) {
                  var latestMsg = messages[0];
                  bru.setVar("debug_msg_id", latestMsg.id);
                  console.log("Mailinator: fetching message " + latestMsg.id);
                  var msgUrl = "https://api.mailinator.com/api/v2/domains/public/messages/" + encodeURIComponent(latestMsg.id);
                  $.ajax({
                    url: msgUrl,
                    method: "GET",
                    success: function(msg) {
                      var msgKeys = Object.keys(msg);
                      bru.setVar("debug_msg_keys", msgKeys.join(","));
                      console.log("Mailinator: response keys=" + msgKeys.join(","));
                      var emailBody = "";
                      var fromData = msg.data && msg.data.parts;
                      var parts = fromData || msg.parts;
                      bru.setVar("debug_parts_source", fromData ? "data.parts" : (msg.parts ? "msg.parts" : "none"));
                      if (parts && parts.length > 0) {
                        emailBody = parts[0].body || "";
                      }
                      bru.setVar("debug_body_length", String(emailBody.length));
                      bru.setVar("debug_body_preview", emailBody.substring(0, 300));
                      console.log("Mailinator: emailBody length=" + emailBody.length + ", first 200=" + emailBody.substring(0,200).replace(/\n/g, "\\n"));
                      var match = emailBody.match(/https?:\/\/[^\s<"']+/);
                      if (match) {
                        var magicUrl = match[0];
                        bru.setVar("debug_magic_url", magicUrl);
                        console.log("Mailinator: magicUrl found: " + magicUrl);
                        var pashMatch = magicUrl.match(/[?&]preAuthSessionId=([^&#]+)/);
                        var lcMatch = magicUrl.match(/#([^#]+)$/);
                        bru.setVar("debug_pash_raw", pashMatch ? pashMatch[1] : "null");
                        bru.setVar("debug_lc_raw", lcMatch ? lcMatch[1] : "null");
                        console.log("Mailinator: pashMatch=" + (pashMatch ? pashMatch[1] : "null") + ", lcMatch=" + (lcMatch ? lcMatch[1] : "null"));
                        if (pashMatch && lcMatch) {
                          var decodedPash = decodeURIComponent(pashMatch[1]);
                          var decodedLc = decodeURIComponent(lcMatch[1]);
                          console.log("Mailinator: decoded preAuthSessionId=" + decodedPash + ", decoded linkCode=" + decodedLc);
                          bru.setVar("debug_status", "success");
                          bru.setVar("preAuthSessionId", decodedPash);
                          bru.setVar("linkCode", decodedLc);
                          console.log("Mailinator: bru.vars set - preAuthSessionId=" + bru.getVar("preAuthSessionId"));
                          console.log("Mailinator: calling bru.cb(), extraction complete");
                          bru.cb();
                          return;
                        }
                      } else {
                        bru.setVar("debug_status", "no_url_match");
                        console.log("Mailinator: no URL match in emailBody");
                      }
                      bru.setVar("debug_status", "no_match_retry_" + retry);
                      console.log("Mailinator: magic link not found, retrying...");
                      fetchAndParse(retry + 1);
                    },
                    error: function(err) {
                      bru.setVar("debug_msg_error", String(retry));
                      console.log("Mailinator: fetch message failed, retrying...");
                      fetchAndParse(retry + 1);
                    }
                  });
                } else {
                  bru.setVar("debug_status", "no_msgs_retry_" + retry);
                  console.log("Mailinator: no messages found, retrying...");
                  fetchAndParse(retry + 1);
                }
              },
              error: function(err) {
                bru.setVar("debug_inbox_error", String(retry));
                console.log("Mailinator: fetch inbox failed, retrying...");
                fetchAndParse(retry + 1);
              }
            });
          }, delays[retry]);
        }

        fetchAndParse(0);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: "magic link successfully generated"
    - expression: res.responseTime
      operator: lt
      value: "10000"
