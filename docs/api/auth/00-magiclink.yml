info:
  name: Send Magic Link
  description: Sends a passwordless magic link to konsulin@mailinator.com with all roles
  type: http
http:
  method: POST
  url: "{{process.env.BASE_URL}}/api/v1/auth/magiclink"
  headers:
    - name: content-type
      value: application/json
    - name: X-API-Key
      value: "{{process.env.SUPERADMIN_API_KEY}}"
  body:
    type: json
    data: |-
      {
        "email": "konsulin@mailinator.com",
        "roles": ["Patient", "Practitioner", "Clinic Admin", "Researcher"]
      }
docs: |
  Initiates a passwordless magic link flow via SuperTokens for konsulin@mailinator.com.
  The link is sent to the Mailinator public inbox. After sending, the after-response
  script polls Mailinator (up to 3 retries with exponential backoff: 30s, 60s, 120s)
  to retrieve the latest email, extract the magic link URL, and save preAuthSessionId
  and linkCode as collection variables for the subsequent consume-code step.

  ### Request Fields
  - `email`: `konsulin@mailinator.com` — Mailinator public inbox for automated retrieval.
  - `roles`: All four roles are assigned to enable testing across RBAC scenarios.

  ### Responses
  - **200 OK**: Magic link generated. Body: `{ "success": true, "message": "magic link successfully generated" }`.
  - **400 Bad Request**: Validation error. Body: `{ "success": false, "message": "...", "status_code": 400 }`.
  - **500 Internal Server Error**: Server failure. Body: `{ "success": false, "message": "...", "status_code": 500 }`.
examples:
  - name: Success
    request:
      method: POST
      url: "{{process.env.BASE_URL}}/api/v1/auth/magiclink"
      headers:
        - name: content-type
          value: application/json
        - name: X-API-Key
          value: "{{process.env.SUPERADMIN_API_KEY}}"
      body:
        type: json
        data: '{"email":"konsulin@mailinator.com","roles":["Patient","Practitioner","Clinic Admin","Researcher"]}'
    response:
      status: 200
      body:
        type: json
        data: '{"success":true,"message":"magic link successfully generated"}'
runtime:
  scripts:
    - type: after-response
      code: |-
        var cp = require('child_process');

        function sleep(ms) {
          var start = Date.now();
          while (Date.now() - start < ms) {}
        }

        var inboxUrl = 'https://api.mailinator.com/api/v2/domains/public/inboxes/konsulin';
        var found = false;

        for (var attempt = 0; attempt < 30; attempt++) {
          bru.setVar("debug_attempt", String(attempt));
          try {
            var out = cp.execSync('curl -s ' + JSON.stringify(inboxUrl), { timeout: 10000, shell: true });
            var data = JSON.parse(out.toString());
            var msgs = data.messages;
            bru.setVar("debug_inbox_msgs", String(msgs ? msgs.length : 0));

            if (msgs && msgs.length > 0) {
              var msgId = msgs[0].id;
              bru.setVar("debug_msg_id", msgId);

              var linksUrl = 'https://api.mailinator.com/api/v2/domains/public/messages/' + encodeURIComponent(msgId) + '/links';
              var linksOut = cp.execSync('curl -s ' + JSON.stringify(linksUrl), { timeout: 10000, shell: true });
              var linksData = JSON.parse(linksOut.toString());

              bru.setVar("debug_links_count", String(linksData.links ? linksData.links.length : 0));

              if (linksData.links) {
                for (var li = 0; li < linksData.links.length; li++) {
                  var link = linksData.links[li];
                  if (link.indexOf('/auth/verify') !== -1 || link.indexOf('preAuthSessionId=') !== -1) {
                    bru.setVar("debug_magic_url", link);
                    var pashMatch = link.match(/[?&]preAuthSessionId=([^&#]+)/);
                    var lcMatch = link.match(/#([^#]+)$/);
                    bru.setVar("debug_pash_raw", pashMatch ? pashMatch[1] : "null");
                    bru.setVar("debug_lc_raw", lcMatch ? lcMatch[1] : "null");
                    if (pashMatch && lcMatch) {
                      bru.setVar("preAuthSessionId", decodeURIComponent(pashMatch[1]));
                      bru.setVar("linkCode", decodeURIComponent(lcMatch[1]));
                      bru.setVar("debug_status", "success");
                      found = true;
                      break;
                    }
                  }
                }
              }
              if (found) break;
            }
          } catch (e) {
            bru.setVar("debug_error_" + attempt, String(e.message || e));
          }
          sleep(2000);
        }

        if (!found) {
          bru.setVar("debug_status", "max_retries");
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: "magic link successfully generated"
    - expression: res.responseTime
      operator: lt
      value: "10000"
