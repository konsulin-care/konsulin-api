info:
  name: Debug Session
  description: Tests cookie jar + manual bearer extraction
  type: http
http:
  method: POST
  url: "{{BASE_URL}}/api/v1/auth/active-role"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "Patient"
      }
runtime:
  scripts:
    - type: pre-request
      code: |-
        console.log("=== PRE-REQUEST ===");
        var token = bru.getVar("sessionToken");
        if (token) {
          console.log("Using saved sessionToken: " + token.substring(0, 20) + "...");
          bru.setVar("authHeader", "Bearer " + token);
        } else {
          console.log("No sessionToken found");
        }
    - type: after-response
      code: |-
        console.log("Status: " + res.status);
        if (res.body) {
          console.log("Body: " + JSON.stringify(res.body).substring(0, 200));
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
