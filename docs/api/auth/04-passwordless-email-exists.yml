info:
  name: 04 - Check Email Exists
  description: Checks whether a passwordless user exists for konsulin@mailinator.com
  type: http
http:
  method: GET
  url: "{{process.env.BASE_URL}}/api/v1/auth/passwordless/email/exists?email=konsulin@mailinator.com"
  headers:
    - name: content-type
      value: application/json
docs: |
  Checks if a SuperTokens passwordless user exists for the given email.

  ### Query Parameters
  - `email`: (required) `konsulin@mailinator.com`.

  ### Responses
  - **200 OK**: Lookup completed. Body: `{ "exists": true|false, "status": "OK", "patientIds": [...], "practitionerIds": [...] }`.
  - **400 Bad Request**: Missing `email` query parameter. Body: `{ "success": false, "message": "email is required", "status_code": 400 }`.
  - **500 Internal Server Error**: Server failure.
examples:
  - name: User exists
    request:
      method: GET
      url: "{{process.env.BASE_URL}}/api/v1/auth/passwordless/email/exists?email=konsulin@mailinator.com"
      headers:
        - name: content-type
          value: application/json
    response:
      status: 200
      body:
        type: json
        data: '{"exists":true,"status":"OK","patientIds":["Patient/1"],"practitionerIds":[]}'
  - name: User not found
    request:
      method: GET
      url: "{{process.env.BASE_URL}}/api/v1/auth/passwordless/email/exists?email=unknown@example.com"
      headers:
        - name: content-type
          value: application/json
    response:
      status: 200
      body:
        type: json
        data: '{"exists":false,"status":"OK","patientIds":[],"practitionerIds":[]}'
  - name: Missing email
    request:
      method: GET
      url: "{{process.env.BASE_URL}}/api/v1/auth/passwordless/email/exists"
      headers:
        - name: content-type
          value: application/json
    response:
      status: 400
      body:
        type: json
        data: '{"success":false,"message":"email is required","status_code":400}'
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: "OK"
    - expression: res.body.exists
      operator: isDefined
    - expression: res.responseTime
      operator: lt
      value: "5000"
