info:
  name: Debug Session4
  description: Try to read cookie from jar after consume
  type: http
http:
  method: POST
  url: "{{process.env.BASE_URL}}/api/v1/auth/signinup/code/consume"
  headers:
    - name: content-type
      value: application/json
    - name: st-auth-mode
      value: cookie
  body:
    type: json
    data: |-
      {
        "preAuthSessionId": "{{preAuthSessionId}}",
        "linkCode": "{{linkCode}}"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("after-response start...");
        var baseUrl = bru.getVar("process.env.BASE_URL") || "http://localhost:3200";
        console.log("Checking cookies for: " + baseUrl);

        var jar = bru.cookies.jar();
        console.log("jar: " + jar);

        // Try to get cookies
        if (jar) {
          jar.getCookies(baseUrl, function(err, cookies) {
            if (err) {
              console.log("Error: " + err.message);
            } else {
              console.log("Cookies found: " + (cookies ? cookies.length : 0));
              if (cookies) {
                for (var i = 0; i < cookies.length; i++) {
                  console.log("  [" + i + "] " + cookies[i].key + "=" + (cookies[i].value || "").substring(0, 20) + "...");
                }
              }
            }
          });
        }
        console.log("done checking cookies");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
