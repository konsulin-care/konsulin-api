info:
  name: Debug Check Cookie
  description: Check if cookies persist between requests
  type: http
http:
  method: GET
  url: "{{process.env.BASE_URL}}/fhir/metadata"
  headers:
    - name: content-type
      value: application/fhir+json
runtime:
  scripts:
    - type: pre-request
      code: |-
        var baseUrl = bru.getVar("process.env.BASE_URL") || "http://localhost:3200";
        var jar = bru.cookies.jar();
        console.log("Checking cookies at: " + baseUrl);
        if (jar) {
          jar.getCookies(baseUrl, function(err, cookies) {
            if (err) {
              console.log("Error getting cookies: " + err.message);
            } else {
              console.log("Cookies found: " + (cookies ? cookies.length : 0));
              if (cookies && cookies.length > 0) {
                for (var i = 0; i < cookies.length; i++) {
                  console.log("  [" + i + "] " + cookies[i].key);
                }
              }
            }
          });
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
