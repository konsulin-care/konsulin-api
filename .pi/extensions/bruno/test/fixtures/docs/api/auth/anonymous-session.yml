info:
  name: Create Anonymous Session
  type: http
  seq: 3

http:
  method: POST
  url: "{{process.env.APP_BASE_URL}}/api/v1/auth/anonymous-session"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"

runtime:
  scripts:
    - type: after-response
      code: |
        const body = res.getBody();
        if (body && body.data && body.data.token) {
          bru.setVar("authToken", body.data.token);
        }
        bru.runner.setNextRequest("Mailinator Poll Inbox");
  assertions: []

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
