[tools]
golangci-lint = "2.15.0"
gofumpt = "0.11.0"
shellcheck = "0.11.0"
node = "26"
"npm:@usebruno/cli" = "4.0.0"
lefthook = "2.2.2"
actionlint = "1.7.12"
yq = "4.54.3"
"github:hadolint/hadolint" = "2.14.0"

[hooks]
# Install the git hooks after `mise install`. CI never runs hooks (and may not
# have lefthook installed), so the install is skipped there.
postinstall = '[ -n "${CI:-}" ] || mise x lefthook -- lefthook install'

[tasks.lint]
description = "Run all linters on the whole repo"
depends = ["lint:files", "lint:go", "lint:fmt", "lint:mod", "lint:docker", "lint:actions", "lint:config"]

[tasks."lint:files"]
description = "File hygiene (EOF, whitespace, large files, YAML) on given or all tracked files"
run = 'sh scripts/lint/files.sh'

[tasks."lint:go"]
description = "golangci-lint on new code vs HEAD, vs --base REF, or --full"
usage = '''
flag "--base <ref>" help="Lint changes since merge-base with REF"
flag "--full" help="Lint the whole module"
'''
run = 'sh scripts/lint/golangci.sh'

[tasks."lint:fmt"]
description = "gofumpt check on given files, staged files, or changes vs --base REF"
run = 'sh scripts/lint/gofumpt.sh'

[tasks."lint:mod"]
description = "Check go.mod/go.sum are tidy"
run = 'go mod tidy && git diff --exit-code go.mod go.sum'

[tasks."lint:docker"]
description = "hadolint on all tracked Dockerfiles"
run = 'hadolint --failure-threshold error $(git ls-files "*Dockerfile*")'

[tasks."lint:actions"]
description = "actionlint on GitHub workflows"
run = 'actionlint $(git ls-files ".github/workflows/*.yml" ".github/workflows/*.yaml" | grep -v trigger-coolify.yml)'

[tasks."lint:config"]
description = "Validate .golangci.yml"
run = 'golangci-lint config verify'

[tasks.test]
description = "go test -race on all packages"
run = 'go test -race ./...'

[tasks."test:api"]
description = "Bruno API journey (required; API must be running)"
run = 'bash scripts/bru-run.sh --required --skip-cleanup'

[tasks.vuln]
description = "govulncheck via go.mod tool"
run = 'go tool govulncheck ./...'

[tasks."hooks:install"]
description = "Install lefthook git hooks"
run = 'lefthook install'

[tasks.setup]
description = "Create .env if missing and start the stack"
run = 'sh scripts/dev/setup.sh'

[tasks.stack]
description = "Docker stack lifecycle: --up --down --status --reset"
usage = '''
flag "--up" help="Start postgres, redis, blaze, supertokens"
flag "--down" help="Stop the stack"
flag "--status" help="Show service status"
flag "--reset" help="Stop and delete volumes (asks first)"
'''
run = 'sh scripts/dev/stack.sh'

[tasks.dev]
description = "Run the backend locally (sources .env if present)"
run = '''
if [ -f ./.env ]; then set -a; . ./.env; set +a; fi
go run ./cmd/http
'''

[tasks.logs]
description = "Follow docker compose logs (compose services only; backend logs go to stdout and are not covered)"
usage = '''
arg "[service]" help="Compose service"
'''
run = 'sh scripts/dev/logs.sh'

[tasks.verify]
description = "Check an env file: mise run verify [FILE] [--standalone|--federation] [--offline]"
usage = '''
arg "[file]" help="Env file to check" default=".env"
flag "--standalone" help="Check a standalone backend env"
flag "--federation" help="Check a backend + gateway env"
flag "--offline" help="Skip gateway network checks"
'''
run = '''
set -- "$usage_file"
if [ "${usage_standalone:-false}" = "true" ]; then set -- "$@" --standalone; fi
if [ "${usage_federation:-false}" = "true" ]; then set -- "$@" --federation; fi
if [ "${usage_offline:-false}" = "true" ]; then set -- "$@" --offline; fi
go run ./cmd/party verify "$@"
'''

[tasks.gateway]
description = "Gateway onboarding: --init keygen, --enroll redeem token, --dev contributor bootstrap"
usage = '''
flag "--init" help="Generate party keys (stdout only)"
flag "--enroll" help="Redeem the enrollment token (sources .env)"
flag "--dev" help="Contributor-only: run gateway-bootstrap.sh (needs GATEWAY_URL, OPERATOR_PASSWORD in env)"
'''
run = 'sh scripts/dev/gateway.sh'

[settings]
idiomatic_version_file_enable_tools = ["go"]
