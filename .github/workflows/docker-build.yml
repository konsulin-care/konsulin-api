name: Docker Build and Push

on:
  workflow_call:
    inputs:
      TZ_ARG:
        type: string
        required: true
      AUTHOR:
        type: string
        required: true
      VERSION:
        type: string
        required: true
      TAG:
        type: string
        required: true
      GIT_COMMIT:
        type: string
        required: true
      BUILD_TIME:
        type: string
        required: true
      RUN_NUMBER:
        type: string
        required: true
      IS_DEV:
        type: boolean
        required: true
      IS_PROD:
        type: boolean
        required: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: konsulin-api

    steps:
      - name: Debug - Display Input Variables
        run: |
          echo "=== DOCKER BUILD INPUT VARIABLES ==="
          echo "TZ_ARG: $TZ_ARG"
          echo "AUTHOR: $AUTHOR"
          echo "GIT_COMMIT: $GIT_COMMIT"
          echo "BUILD_TIME: $BUILD_TIME"
          echo "RUN_NUMBER: $RUN_NUMBER"
          echo "IS_DEV: $IS_DEV"
          echo "IS_PROD: $IS_PROD"
          echo ""
          echo "=== SECRETS (masked) ==="
          echo "DOCKER_USERNAME: $IMAGE_NAMESPACE"
          echo "DOCKER_PASSWORD: [MASKED]"

      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Get Timestamp (for Dev Tag)
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Get Branch Name
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Build Vendor Image
        run: |
          docker build \
            -t $IMAGE_NAMESPACE/$IMAGE_NAME-vendor:latest \
            -f Dockerfile-vendor .

      - name: Push Vendor Image
        run: |
          docker push $IMAGE_NAMESPACE/$IMAGE_NAME-vendor:latest

      - name: Replace FROM in Dockerfile with image from ENV
        run: |
          sed -i -E "s|^[[:space:]]*FROM[[:space:]]+.*[[:space:]]+[Aa][Ss][[:space:]]+gobuild|FROM ${IMAGE_NAMESPACE}/${IMAGE_NAME}-vendor:latest as gobuild|" Dockerfile

      - name: Build and Push Docker Images
        run: |
          if [ "$IS_DEV" == "true" ]; then
            echo "Development build..."
            VERSION="dev-${SHORT_SHA}"
            docker build \
              -t $IMAGE_NAMESPACE/$IMAGE_NAME:nightly \
              -t $IMAGE_NAMESPACE/$IMAGE_NAME:${VERSION} \
              -f Dockerfile \
              --build-arg TZ_ARG="$TZ_ARG" \
              --build-arg VERSION="$BUILD_VERSION_ARG" \
              --build-arg GIT_COMMIT="$GIT_COMMIT" \
              --build-arg TAG="$BUILD_TAG_ARG" \
              --build-arg AUTHOR="$AUTHOR" \
              --build-arg RUN_NUMBER="$RUN_NUMBER" \
              --build-arg BUILD_TIME="$BUILD_TIME" .

            docker push $IMAGE_NAMESPACE/$IMAGE_NAME:nightly
            docker push $IMAGE_NAMESPACE/$IMAGE_NAME:${VERSION}

          elif [ "$IS_PROD" == "true" ]; then
            echo "Production build..."
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
            docker build \
              -t $IMAGE_NAMESPACE/$IMAGE_NAME:latest \
              -t $IMAGE_NAMESPACE/$IMAGE_NAME:${VERSION} \
              -f Dockerfile \
              --build-arg TZ_ARG="$TZ_ARG" \
              --build-arg VERSION="$BUILD_VERSION_ARG" \
              --build-arg GIT_COMMIT="$GIT_COMMIT" \
              --build-arg TAG="$BUILD_TAG_ARG" \
              --build-arg AUTHOR="$AUTHOR" \
              --build-arg RUN_NUMBER="$RUN_NUMBER" \
              --build-arg BUILD_TIME="$BUILD_TIME" .

            docker push $IMAGE_NAMESPACE/$IMAGE_NAME:latest
            docker push $IMAGE_NAMESPACE/$IMAGE_NAME:${VERSION}
          else
            echo "No valid environment specified. in productions need 2 conditions: branch is main and tag starts with v"
            exit 1
          fi
