name: PR Quality and Security

# Authoritative quality + security gate for pull requests. Independent of local
# Git hooks (git commit/push --no-verify cannot bypass these checks).
#
# Jobs:
#   quality          — gofumpt, golangci-lint, go vet, go test, go test -race
#   static-security  — govulncheck (blocking), Trivy vuln (blocking),
#                      Trivy secrets/config (SARIF, non-blocking). Semgrep
#                      runs via the GitHub App, not in CI.
#   codeql           — CodeQL Go analysis (SARIF; status lives in Code Scanning)
#   integration      — federation gateway bootstrap + disposable Docker env +
#                      full Bruno suite (auth, RBAC, ownership-violation) —
#                      the API security regression gate
#   build            — Docker image smoke build (vendor + app) + Trivy image scan
#
# Keep PR-time jobs deterministic: no active scanners, no external mailboxes,
# no noisy DAST. Deeper ZAP/fuzz runs live in security-weekly.yml.
#
# Enable in repository settings (Settings → Code security and analysis):
#   - GitHub Advanced Security / CodeQL
#   - Secret scanning + push protection

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"

jobs:
  quality:
    name: Quality (format, lint, vet, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # Formatting gate on changed files only — mirrors the "new issues"
      # philosophy of the golangci-lint gate below so pre-existing legacy files
      # never block a PR, while new code must be gofumpt-clean.
      - name: gofumpt formatting check (changed files)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo HEAD)
          files=$(git diff --name-only "$base" HEAD -- '*.go' || true)
          if [ -n "$files" ]; then
            violations=$(printf '%s\n' "$files" | xargs -d '\n' go tool gofumpt -l)
            test -z "$violations" || { echo "gofumpt violations:"; echo "$violations"; exit 1; }
          else
            echo "no Go files changed vs $base"
          fi

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint (new issues only)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
          only-new-issues: true
          args: --timeout=5m

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

  static-security:
    name: Static security (govulncheck, Trivy)
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck (blocking)
        run: go tool govulncheck ./...

      # Blocking: HIGH/CRITICAL vulnerabilities in the Go module graph.
      # Uses aquasecurity/trivy-action pinned by commit SHA (post March-2026
      # supply-chain incident) with an explicit clean Trivy version. The `#
      # v0.36.0` tag comment lets Dependabot bump the pin safely.
      - name: Trivy vulnerability scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.74.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

      - name: Ensure trivy out dir
        run: mkdir -p trivy

      # Non-blocking: repository secrets + misconfiguration hygiene. Reported
      # as SARIF into Code Scanning instead of hard-failing the PR (push
      # protection already blocks committed secrets at the source).
      - name: Trivy secrets & config scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.74.0
          severity: HIGH,CRITICAL
          scanners: secret,config
          format: sarif
          output: trivy/trivy-secret-config.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy/trivy-secret-config.sarif') != ''
        with:
          sarif_file: trivy/trivy-secret-config.sarif

      # No Semgrep CI step: the Semgrep GitHub App posts its findings on every
      # PR via its own check run (see workflows README).

  codeql:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: github/codeql-action/init@v4
        with:
          languages: go

      - run: go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  integration:
    name: Integration and API security tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v7

      # The federation gateway starts and bootstraps BEFORE the ci-env action
      # below: the action starts the app, and the app must boot with the
      # APP_GATEWAY_URL / APP_PARTY_* values this bootstrap emits. The gateway
      # is standalone (its own SQLite), so it starts ahead of .env.ci — but
      # compose interpolates the whole file at load, so the ci-env inputs are
      # mirrored into this step's environment (the action writes the same
      # values into .env.ci right after). Signing keys and the operator
      # credential are generated per run and never committed.
      - name: Start federation gateway (dev mode)
        env:
          POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ vars.CI_REDIS_PASSWORD }}
          SUPERTOKEN_API_KEY: ${{ vars.CI_SUPERTOKEN_API_KEY }}
          SUPERADMIN_API_KEY: ${{ vars.CI_SUPERADMIN_API_KEY }}
          JWT_HOOK_KEY: ${{ vars.CI_JWT_HOOK_KEY }}
          XENDIT_SANDBOX_API_KEY: ${{ vars.CI_XENDIT_SANDBOX_API_KEY }}
          XENDIT_CALLBACK_TOKEN: ${{ vars.CI_XENDIT_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail

          # Ephemeral Ed25519 signing keys (base64 DER, gateway .env.example
          # format); the gateway and admin keys must be distinct.
          APP_GATEWAY_SIGNING_KEY=$(openssl genpkey -algorithm ed25519 -outform DER | base64 -w0)
          APP_ADMIN_SIGNING_KEY=$(openssl genpkey -algorithm ed25519 -outform DER | base64 -w0)
          if [ -z "$APP_GATEWAY_SIGNING_KEY" ] || [ "$APP_GATEWAY_SIGNING_KEY" = "$APP_ADMIN_SIGNING_KEY" ]; then
            echo "::error::gateway and admin signing keys must be distinct and non-empty" >&2
            exit 1
          fi
          export APP_GATEWAY_SIGNING_KEY APP_ADMIN_SIGNING_KEY

          # Dev-mode operator login: random password (hex — safe to embed in
          # the JSON login body) + bcrypt hash for APP_OPERATOR_CREDENTIALS.
          OPERATOR_PASSWORD=$(openssl rand -hex 16)
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq apache2-utils
          fi
          OPERATOR_HASH=$(htpasswd -bnBC 12 "" "$OPERATOR_PASSWORD" | tr -d ':\n')
          export APP_OPERATOR_CREDENTIALS="operator:${OPERATOR_HASH}"
          # Next step: gateway-bootstrap.sh logs in with this password.
          printf 'OPERATOR_PASSWORD=%s\n' "$OPERATOR_PASSWORD" >> "$GITHUB_ENV"

          docker compose -f docker-compose.ci.yml up -d gateway

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8082/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            docker compose -f docker-compose.ci.yml logs --tail=200 gateway 2>/dev/null || true
            echo "::error::Federation gateway did not become healthy in time" >&2
            exit 1
          fi

      # Enroll both parties, grant capabilities and enlist the stub listings,
      # then export APP_GATEWAY_URL / APP_PARTY_* / APP_AUTOMATION_PARTY_ID
      # into the job environment — the ci-env action's `docker compose up -d
      # app` interpolates them into the app service (see docker-compose.ci.yml).
      # STUB_BASE_URL is the ci-net hostname because the gateway (not the
      # runner) dials the enlisted endpoints.
      - name: Bootstrap federation gateway (parties, listings, app env)
        run: |
          set -euo pipefail
          export GATEWAY_URL=http://localhost:8082
          export STUB_BASE_URL=http://ci-stub:8081
          bash scripts/ci/gateway-bootstrap.sh
          # The script exported the runner-loopback URL it used itself; the
          # app container reaches the gateway over ci-net instead. Last write
          # to $GITHUB_ENV wins for the steps below.
          printf 'APP_GATEWAY_URL=http://gateway:8080\n' >> "$GITHUB_ENV"

      # Isolated disposable environment: infra + app + unified Go stub
      # (magiclink + xendit). Synthetic accounts/data only. The federation
      # gateway above is already running; the app boots enrolled against it.
      - name: Start disposable CI environment
        uses: ./.github/actions/ci-env
        with:
          ci-postgres-password: ${{ vars.CI_POSTGRES_PASSWORD }}
          ci-redis-password: ${{ vars.CI_REDIS_PASSWORD }}
          ci-supertoken-api-key: ${{ vars.CI_SUPERTOKEN_API_KEY }}
          ci-superadmin-api-key: ${{ vars.CI_SUPERADMIN_API_KEY }}
          ci-xendit-callback-token: ${{ vars.CI_XENDIT_CALLBACK_TOKEN }}
          ci-xendit-sandbox-api-key: ${{ vars.CI_XENDIT_SANDBOX_API_KEY }}
          ci-jwt-hook-key: ${{ vars.CI_JWT_HOOK_KEY }}
          organization: ci-${{ github.run_id }}-org

      # Full Bruno chain in one required run: seed org (entry; Organization/
      # seed-clinic via direct-Blaze PUT) → auth (magiclink via local stub,
      # anonymous sessions, role switching) → rest of seeds → ownership-violation
      # suite (16 security requests; expected-4xx regressions fail the PR) →
      # patient journey → practitioner journey → admin (API-key superadmin).
      # The journey terminates without the chained teardown (--skip-cleanup
      # sets skipCleanup=true); scripts/bru-cleanup.sh sweeps the seeds after
      # the suite.
      - name: Run Bruno API security suite (auth, RBAC, ownership)
        run: bash scripts/bru-run.sh --required --skip-cleanup

      - name: Upload Bruno JSON report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bru-report
          path: docs/api/bru-report.*
          if-no-files-found: warn

      - name: Capture environment logs
        if: always()
        run: docker compose --env-file .env.ci -f docker-compose.ci.yml logs --tail=300 app supertokens ci-stub > ci-env-logs.txt 2>&1 || true

      - name: Upload environment logs
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-env-logs
          path: ci-env-logs.txt
          if-no-files-found: warn

      - name: Teardown disposable environment
        if: always()
        run: docker compose --env-file .env.ci -f docker-compose.ci.yml down -v --remove-orphans

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Build Vendor Image
        run: |
          docker build \
            -t "konsulin/konsulin-api-vendor:pr-${SHORT_SHA}" \
            -f Dockerfile-vendor .

      - name: Replace FROM to use local vendor pr-tag
        run: |
          sed -i -E "s|^[[:space:]]*FROM[[:space:]]+.*[[:space:]]+[Aa][Ss][[:space:]]+gobuild|FROM konsulin/konsulin-api-vendor:pr-${SHORT_SHA} as gobuild|" Dockerfile

      - name: Verify FROM replacement
        run: |
          echo "Dockerfile gobuild line after sed:"
          grep -i "from" Dockerfile | grep gobuild

      - name: Build Main Docker Image
        run: |
          docker build \
            -t "konsulin/konsulin-api:pr-${SHORT_SHA}" \
            -f Dockerfile .

      - name: Verify Built Images
        run: |
          docker images | grep konsulin-api

      - name: Ensure trivy out dir
        run: mkdir -p trivy

      # Blocking image scan: catches OS-level CVEs in the runtime base image
      # that `trivy fs` (source tree) cannot see. SARIF is uploaded even when
      # the scan fails so findings always surface in Code Scanning.
      - name: Trivy image scan (blocking + SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: konsulin/konsulin-api:pr-${{ env.SHORT_SHA }}
          version: v0.74.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy/trivy-image.sarif

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy/trivy-image.sarif') != ''
        with:
          sarif_file: trivy/trivy-image.sarif

      # Always upload SARIF as artifact so CVEs are inspectable when the
      # blocking scan fails (Trivy may exit before writing Code Scanning output).
      - name: Upload Trivy image report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-image-report
          path: trivy/trivy-image.sarif
          if-no-files-found: warn
